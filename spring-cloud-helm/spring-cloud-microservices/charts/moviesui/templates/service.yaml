apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: springboot-app-deploy
  labels:
    app: {{ .Chart.Name }}
spec:
  selector:
    app: {{ .Chart.Name }}
  ports:
    - protocol: TCP
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      {{- if .Values.expose }}
      nodePort: {{ .Values.nodePort }}
      {{- end }}
  type: {{ if .Values.expose }}NodePort{{ else }}ClusterIP{{ end }}
